name: 백업

# 주 1회 + 매월 1일 DB 전체 덤프를 암호화해 **비공개 리포**(animalmate-backups)에 보관한다.
#
# 왜 비공개 리포인가(07-DECISIONS 45): 이 리포는 public 이고, public 리포의 Actions 아티팩트는
# 누구나 내려받을 수 있다. 암호화돼 있어도 회원·지원자 PII 덤프를 공개 인터넷에 두는 셈이라
# 보관처로 부적합하다. Supabase 비공개 버킷도 백업 대상과 같은 프로젝트 안이라 오프사이트가 아니다.
#
# 무료 티어에는 자동 백업이 없다 — 이 잡이 유일한 안전망이다.
#
# ── 사전 준비(사람이 1회) ──────────────────────────────────────────────────
#  1. GitHub Org 에 **비공개** 리포 `animalmate-backups` 생성.
#     커밋이 하나도 없는 빈 리포여도 된다 — 아래 "백업 리포 준비" 스텝이 첫 커밋을 만든다.
#  2. fine-grained PAT 발급: Repository access = animalmate-backups **한 개만**,
#     권한 = Contents(Read and write) **하나만**. 광범위 토큰 금지.
#  3. 이 리포 Settings > Secrets > Actions 에 등록:
#       BACKUP_REPO_TOKEN     위 PAT
#       BACKUP_ENCRYPTION_KEY 복호화 암호(고엔트로피, 금고에도 보관 — 잃으면 백업 전부 무용지물)
#       DIRECT_URL            세션 풀러(5432) 연결 문자열. pg_dump 는 트랜잭션 풀러(6543)로 못 뜬다
#     실패 알림용 시크릿은 없다 — 아래 alert 잡이 GITHUB_TOKEN 으로 이슈를 만든다.
#  4. 복원 절차와 리허설은 docs/05-ASSET-REGISTRY.md 의 "백업·복원" 절 참고.

on:
  schedule:
    # 주간: 매주 일요일 18:00 UTC = 월요일 03:00 KST(트래픽이 가장 적은 시간).
    - cron: '0 18 * * 0'
    # 월간: 매월 1일 18:00 UTC. 파일명이 UTC 날짜라 '1일자'로 남아 6개월 보존 대상이 된다.
    # 주간 잡만으로는 1일에 걸리는 일이 드물어 월간 보존 규칙이 사실상 동작하지 않는다.
    - cron: '0 18 1 * *'
  workflow_dispatch: # 수동 실행(복원 리허설 전 최신 백업 확보 등)

# 동시에 두 개가 돌면 같은 파일명으로 push 가 충돌한다.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    # 이 잡이 GITHUB_TOKEN 으로 할 일은 이 리포를 읽는 것뿐이다. 백업 리포 쓰기는
    # 별도 PAT(BACKUP_REPO_TOKEN)를 쓰므로 여기에 write 를 줄 이유가 없다.
    permissions:
      contents: read
    steps:
      - name: 메인 리포 체크아웃(보존 정책 스크립트용)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Supabase 서버 버전보다 pg_dump 가 낮으면 거부당한다. PGDG 에서 17 클라이언트를 받는다.
      #
      # ⚠ `/usr/bin/pg_dump` 를 그냥 부르면 안 된다. 그것은 Debian 의 pg_wrapper 이고,
      #    러너에 postgresql-16 **서버 클러스터**가 이미 있어서 17 을 설치해도 16 을 골라 준다.
      #    2026-07-28 첫 실행이 여기서 죽었다: "server version: 17.6; pg_dump version: 16.14".
      #    → 버전이 박힌 절대 경로를 쓰고, 그 경로가 없으면 **즉시 실패**시킨다.
      #      (예전엔 `pg_dump --version` 을 출력만 하고 검사하지 않아 그대로 통과했다.)
      - name: Postgres 17 클라이언트 설치
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          if [ ! -x "$PGDUMP" ]; then
            echo "::error::postgresql-client-17 설치 실패 — $PGDUMP 가 없다. 백업하지 않고 멈춘다."
            exit 1
          fi
          echo "PGDUMP=$PGDUMP" >> "$GITHUB_ENV"
          "$PGDUMP" --version

      # actions/checkout 을 쓰지 않는다. 그것은 기본 브랜치 ref(refs/heads/main)를 직접 fetch 하는데,
      # **갓 만든 빈 리포에는 커밋이 없어 그 ref 자체가 없다** → "couldn't find remote ref refs/heads/main"
      # 으로 실패한다(2026-07-28 첫 실행에서 실제로 겪었다). git clone 은 빈 리포에서도 성공한다.
      - name: 백업 리포 준비
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_REPO_TOKEN:-}" ]; then
            echo "::error::BACKUP_REPO_TOKEN 시크릿이 없다. 백업을 보관할 곳이 없으므로 실패시킨다."
            exit 1
          fi
          # 토큰 값은 Actions 가 로그에서 자동 마스킹한다.
          REPO="https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/animalmate/animalmate-backups.git"

          # **클론을 먼저 시도하고, 실패한 이유를 보고 판단한다.**
          #
          # 예전에는 `git ls-remote --exit-code --heads "$REPO" main > /dev/null 2>&1` 로 먼저
          # 물어봤는데, 그 리다이렉트가 **"main 이 없다"와 "명령이 실패했다"를 똑같이 만들었다.**
          # ls-remote 가 어떤 이유로든 실패하면 빈 리포로 오해하고 빈 히스토리를 새로 만들었고,
          # 부모 없는 커밋이라 push 가 non-fast-forward 로 거부됐다.
          # 2026-07-28 에 실제로 그랬다 — main 이 멀쩡히 있는데 "main 브랜치가 없다"고 판단했다.
          # 첫 백업은 진짜로 빈 리포였기 때문에 이 경로는 그날 처음 실행됐고, 곧바로 실패했다.
          # **두 번째 백업부터 매주 실패할 상태였다.**
          #
          # depth 1 — 과거 커밋까지 받으면 지금까지의 모든 백업을 내려받게 된다(용량 낭비).
          if git clone --depth 1 --branch main --quiet "$REPO" backups 2> clone.err; then
            echo "기존 백업 리포를 받았다. 보유 $(ls backups/dumps 2>/dev/null | wc -l)개"
          elif grep -qiE "Remote branch .* not found|cloned an empty repository" clone.err; then
            # 커밋이 하나도 없는 리포(갓 만든 상태). actions/checkout 은 여기서 죽는다.
            echo "원격에 main 이 없다(빈 리포) — 첫 백업으로 보고 새로 시작한다."
            rm -rf backups && mkdir backups
            git -C backups init -q -b main
            git -C backups remote add origin "$REPO"
          else
            # 인증 실패·네트워크·권한 등. **여기서 빈 히스토리를 만들면 안 된다** —
            # 기존 백업을 못 본 채 새로 시작해 버리고, 운이 나쁘면 과거 백업을 덮어쓴다.
            echo "::error::백업 리포를 받지 못했습니다. 빈 리포가 아니라 **접근 실패**입니다."
            echo "::error::BACKUP_REPO_TOKEN 만료·권한(Contents read/write + Metadata read)을 확인하세요."
            sed 's/^/  /' clone.err >&2
            exit 1
          fi
          rm -f clone.err

      # 덤프 → gzip → gpg 를 **한 파이프라인**으로 흘린다. 평문 .sql 이 디스크에 닿는 순간이 없다.
      # 암호는 argv 가 아니라 fd 3 으로 넣는다(ps 로 보이지 않게). 프로세스 치환이라 임시 파일도 없다.
      - name: 덤프·암호화
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ] || [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::error::DIRECT_URL 또는 BACKUP_ENCRYPTION_KEY 시크릿이 없다. 백업하지 않고 실패시킨다."
            exit 1
          fi
          STAMP="$(date -u +%F)"
          mkdir -p backups/dumps
          OUT="backups/dumps/backup-${STAMP}.sql.gz.gpg"

          # --no-owner/--no-privileges: 복원 대상에 supabase 역할이 없어도 들어가게.
          # $PGDUMP = 버전이 박힌 절대 경로(위 설치 스텝이 검증하고 넘겨준다). pg_wrapper 를 우회한다.
          #
          # ⚠ **범위를 public + drizzle 로 좁힌다.** 예전에는 DB 전체를 떴는데, 그러면 Supabase 가
          #    관리하는 auth·storage·realtime 스키마까지 들어간다. 대상 Supabase 프로젝트에는 그것들이
          #    **이미 있으므로** 복원이 `ERROR: schema "auth" already exists` 로 첫 줄에서 죽는다.
          #    2026-07-28 복원 리허설에서 실제로 겪었다 — 그때까지의 백업은 "열리기는 하는데 되돌릴
          #    수는 없는" 상태였다. 백업은 복원되어야 백업이다.
          #    빠지는 것(auth·storage·realtime)은 이 앱이 쓰지 않거나, 있어도 소용이 없다:
          #      - auth   : 세션이 커스텀 JWT 라 Supabase Auth 를 쓰지 않는다.
          #      - storage: 파일 실체는 덤프에 없다. 메타데이터만 되살려도 가리킬 파일이 없다.
          #      - realtime: 미사용.
          # --extension=vector: 범위를 좁히면 CREATE EXTENSION 이 빠져 `vector(768)` 에서 복원이
          #    깨진다(실측 확인). 이 플래그로 확장 생성문을 덤프에 도로 넣는다.
          "$PGDUMP" "$DIRECT_URL" --no-owner --no-privileges --format=plain \
            --schema=public --schema=drizzle --extension=vector \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 --output "$OUT" \
                  3< <(printf '%s' "$BACKUP_ENCRYPTION_KEY")

          BYTES="$(stat -c%s "$OUT")"
          echo "BACKUP_FILE=$OUT" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=backup-${STAMP}.sql.gz.gpg" >> "$GITHUB_ENV"
          echo "생성: $OUT (${BYTES} bytes)"
          # 덤프가 사실상 비었으면(연결은 됐는데 아무것도 안 나온 경우) 성공으로 넘기지 않는다.
          if [ "$BYTES" -lt 1024 ]; then
            echo "::error::백업 파일이 ${BYTES} bytes 로 너무 작다. 덤프 실패로 본다."
            exit 1
          fi

      # 여기서 복호화가 되는지까지 확인한다. "암호화는 됐는데 열리지 않는 파일"을 6개월 쌓지 않기 위해서다.
      - name: 복호화 검증(gzip 헤더까지 확인)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          # head 가 200바이트를 읽고 끝나면 앞 단계가 SIGPIPE 로 죽는다. pipefail 이 켜져 있으면
          # 정상 동작인데도 스텝이 실패한다 — 그래서 이 파이프라인만 pipefail 을 잠시 끈다.
          set +o pipefail
          HEAD200="$(gpg --batch --quiet --decrypt --passphrase-fd 3 "$BACKUP_FILE" \
                       3< <(printf '%s' "$BACKUP_ENCRYPTION_KEY") 2>/dev/null \
                     | gunzip 2>/dev/null | head -c 200)"
          set -o pipefail
          case "$HEAD200" in
            *"PostgreSQL database dump"*) echo "복호화·압축 해제 확인 완료" ;;
            *) echo "::error::복호화했지만 PostgreSQL 덤프 형식이 아니다. 백업을 신뢰할 수 없다."; exit 1 ;;
          esac

      - name: 보존 정책 적용(최근 8주 + 매월 1일자 6개월)
        run: npx tsx src/ops/prune-backups-cli.ts backups/dumps

      - name: 커밋·푸시
        working-directory: backups
        run: |
          set -euo pipefail
          git config user.name "animalmate-backup-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A dumps
          if git diff --cached --quiet; then
            echo "변경 없음 — 푸시 건너뜀"
            exit 0
          fi
          git commit -q -m "백업 ${BACKUP_NAME}"
          # 첫 백업이면 원격에 main 이 아직 없다 — 인자 없는 push 는 upstream 이 없어 실패한다.
          # HEAD:main 으로 명시하면 첫 푸시와 이후 푸시가 같은 명령으로 처리된다.
          git push -q origin HEAD:main
          echo "푸시 완료: ${BACKUP_NAME}"

      # 워크스페이스는 잡이 끝나면 사라지지만, 이후 스텝이 추가될 때를 대비해 명시적으로 지운다.
      - name: 흔적 정리
        if: always()
        run: rm -rf backups/dumps || true

  # ── 조용한 실패 금지 ────────────────────────────────────────────────────────
  # 백업이 실패하면 **리포에 이슈가 생기고 담당자에게 배정된다.** 배정 알림은 리포 워치
  # 설정과 무관하게 반드시 가므로, "실패했는데 아무도 몰랐다"가 구조적으로 불가능해진다.
  #
  # SMTP 를 쓰지 않는 이유: Actions 에 메일 자격증명을 두면 잡이 실메일을 보낼 수 있게 된다.
  # 이 프로젝트는 테스트 경로에서 메일이 새어 나간 사고를 이미 겪었고(그 뒤로 테스트 환경은
  # 항상 dry), 백업 알림 하나 때문에 그 원칙에 구멍을 내지 않는다.
  #
  # 토큰 선택: BACKUP_REPO_TOKEN 은 **쓸 수 없다.** 그 PAT 은 animalmate-backups 리포의
  # Contents 권한만 가져서 이 리포의 Issues 에 닿지 않는다. 권한을 넓히면 "백업 리포 하나,
  # 권한 하나"라는 최소 권한 설계가 무너진다. 대신 워크플로가 자동으로 받는 GITHUB_TOKEN 에
  # issues:write 만 준다 — 새 시크릿이 필요 없고 이 리포 밖으로는 아무것도 못 한다.
  #
  # 잡을 분리한 이유: 권한은 잡 단위라, 이 알림을 dump 잡에 넣으면 덤프 잡이 issues:write 를
  # 함께 갖게 된다. dump 는 contents:read 만 가진 상태로 두는 편이 낫다.
  #
  # ⚠ 이 리포는 public 이라 **이슈도 공개된다.** 그래서 본문에 값·연결 문자열·PII 를 절대
  #   넣지 않는다(원인 목록은 이미 README·docs 에 공개된 수준의 정보다).
  alert:
    needs: dump
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 실패 이슈 생성·배정
        uses: actions/github-script@v7
        env:
          # 인수인계 때 리포 변수 ALERT_ASSIGNEE 만 바꾸면 담당자가 옮겨간다.
          ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || 'hanchaehun' }}
        with:
          script: |
            const label = 'backup-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}`;
            const body = [
              '주간 DB 백업 잡이 **실패**했습니다.',
              '',
              `- 실행 로그: ${runUrl}`,
              `- 트리거: \`${context.eventName}\``,
              '',
              '무료 티어에는 자동 백업이 없어 이 잡이 유일한 안전망입니다.',
              '',
              '자주 나오는 원인:',
              '- `DIRECT_URL` 만료·비밀번호 변경 (세션 풀러 5432 여야 합니다)',
              '- `BACKUP_REPO_TOKEN`(fine-grained PAT) 만료 — 기본 만료가 짧습니다',
              '- Supabase 프로젝트 일시정지',
              '',
              '복원 절차는 `docs/05-ASSET-REGISTRY.md` 의 「백업·복원」 절에 있습니다.',
            ].join('\n');

            // 매주 실패하면 이슈가 매주 쌓인다. 열려 있는 것이 있으면 코멘트로 붙여
            // "같은 문제 N주째"가 한 스레드에서 보이게 한다.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
              core.notice(`기존 이슈 #${open[0].number} 에 코멘트를 달았다.`);
              return;
            }

            const title = `⚠️ 주간 DB 백업 실패 (${new Date().toISOString().slice(0, 10)})`;
            const assignee = process.env.ALERT_ASSIGNEE;
            try {
              const { data: issue } = await github.rest.issues.create({
                ...context.repo, title, body, labels: [label], assignees: [assignee],
              });
              core.notice(`이슈 #${issue.number} 생성 (담당 @${assignee}).`);
            } catch (e) {
              // 담당자 계정이 사라졌거나 권한이 없으면 배정만 실패한다. 그때 알림 자체를
              // 포기하면 이 잡을 만든 이유가 없어지므로, 배정 없이라도 이슈는 남긴다.
              core.warning(`배정 실패(${e.message}) — 배정 없이 이슈만 만든다.`);
              const { data: issue } = await github.rest.issues.create({
                ...context.repo, title, body, labels: [label],
              });
              core.notice(`이슈 #${issue.number} 생성 (배정 없음).`);
            }
