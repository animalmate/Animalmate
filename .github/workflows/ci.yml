name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입체크
        run: npm run typecheck
      - name: 단위 테스트(순수 로직)
        run: npm test
      # RLS 기본 거부 증명(규칙 #8). 실제 Supabase 를 대상으로 anon key 로 전 테이블 접근 거부를
      # 검증한다. public 스키마 테이블을 런타임에 수집하므로 새 테이블 누락도 자동 감지.
      # 아래 시크릿은 GitHub 리포 Settings > Secrets and variables > Actions 에 등록해야 한다.
      - name: RLS 보안 테스트
        run: npm run test:rls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # 모집(recruit) 서비스는 db 를 인자로 받지 않고 db/client 싱글턴을 import 한다.
          # 그 싱글턴이 읽는 변수라, 시크릿이 등록된 환경에서는 이게 있어야 모집 테스트가 실제로 돈다.
          # 별도 시크릿을 두지 않고 같은 DB 를 가리키는 DIRECT_URL 을 그대로 쓴다.
          # (시크릿이 비어 있으면 위 DIRECT_URL 가드에 걸려 전 파일이 skip 된다 — 실패가 아니다.)
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
