name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── ① 코드 품질 + 통합 테스트 (대상: **테스트 DB**) ──────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입체크
        run: npm run typecheck
      # 훅 규칙(무한 렌더 루프)과 Next 필수 룰. 타입체커가 못 보는 자리라 별도 단계로 둔다.
      - name: 린트
        run: npm run lint
      - name: 단위 테스트(순수 로직)
        run: npm test

      # 테스트 DB 의 스키마를 마이그레이션으로 맞춘다. 운영과 같은 마이그레이션을 적용받아야
      # 통합 테스트가 의미를 갖는다. 이미 최신이면 아무것도 하지 않는다(멱등).
      - name: 테스트 DB 마이그레이션
        run: npm run db:migrate:test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      # 통합 테스트는 행을 만들고 지운다. 대상은 **반드시** 테스트 전용 프로젝트다 —
      # test/db-url.ts 가 운영 ref 를 감지하면 하드 실패시킨다. 여기에 운영 DATABASE_URL/
      # DIRECT_URL 을 넣지 말 것(넣으면 그 가드가 무력해지는 게 아니라, 테스트가 죽는다).
      #
      # ⚠ GEMINI_* 는 **셋 다** 있어야 RAG 테스트가 돈다. 키만 넣으면 부족하다 —
      #   src/rag/gemini.ts:19,24 가 모델 ID 가 없으면 던진다. 그리고 키가 없으면
      #   rag-visibility(6개)·chatbot-answer(3개)가 describe.skip 으로 **조용히 빠지면서
      #   초록이 된다**(가짜 초록). 2026-07-29 까지 실제로 그 상태였다 —
      #   GEMINI_API_KEY 가 리포 시크릿에 아예 없어서 CI 는 계속 132/141 만 돌고 있었고,
      #   pgvector 경로(0021 로 확장을 옮긴 그 경로)를 아무도 검증하지 않았다.
      #   판별법은 **테스트 개수**다 — 로그가 `141` 이 아니라 `132 passed | 9 skipped` 면 빠진 것이다.
      #   모델 ID 는 비밀이 아니므로 시크릿이 아니라 평문으로 둔다(값은 .env·Vercel 과 같아야 한다).
      - name: 통합 테스트(테스트 DB)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
          # 결과 조회 실패 카운터가 이름을 HMAC 으로 묶는 데 쓴다(결정 80). **비밀이 아니다** —
          # 여기서는 카운터 식별자를 만드는 용도뿐이라 값이 무엇이든 상관없고, 다만
          # 없으면 lookup-key 가 하드 실패한다(키 없이 해시하면 이름이 되돌아가므로 일부러 던진다).
          # 운영 SESSION_SECRET 을 여기에 넣지 말 것 — 세션 위조에 쓰이는 값이다.
          SESSION_SECRET: ci-dummy-not-a-real-secret

  # ── ② RLS 기본 거부 증명 (대상: **운영 DB**) ────────────────────────────────
  # 이 잡만 운영을 본다. 증명해야 할 대상이 운영의 RLS 이기 때문이다 — 테스트 DB 에서 통과해도
  # 2026-07-27 사고(drizzle-kit push 가 운영 28개 테이블의 RLS 를 해제)를 잡지 못한다.
  # anon key 로 접근이 거부되는지만 확인하는 **비파괴적** 테스트다(읽기 시도만 한다).
  #
  # ⚠ **소요 시간으로 판별하지 말 것.** 예전에는 "13초면 skip, 6~8분이면 진짜"였는데, 그건
  #   test:rls 가 통합 24개 파일을 전부 함께 돌리던 시절의 숫자다. RLS 스위트만 떼어낸 지금은
  #   정상 실행이 **16초**다(2026-07-28 실측). 시간으로 보면 앞으로 정반대로 오해한다.
  #   판별 기준은 **테스트 개수**다 — 로그에 `test/rls.security.test.ts (88 tests)` 처럼 찍힌다.
  #   시크릿이 없으면 describe.skip 이라 0개로 지나가면서 초록이 된다(가짜 초록).
  #
  # ⚠ **이 잡만 운영 자격증명을 들고 돈다 — 그래서 신뢰할 수 있는 코드에서만 돌린다.**
  #   `on: pull_request` 는 **PR 이 가져온 코드**를 실행한다. 아래 스텝의 env 에는 운영
  #   `DIRECT_URL`(Postgres 전체 연결 문자열)이 들어 있으므로, PR 이 `test/rls.security.test.ts`
  #   나 `vitest.prod.config.ts` 를 한 줄만 고쳐 오면 그 값을 그대로 밖으로 보낼 수 있다.
  #   포크 PR 에는 GitHub 가 시크릿을 주지 않아 지금 당장 뚫려 있진 않지만, 이 리포는 public 이라
  #   외부 기여를 한 번 받기 시작하거나 collaborator 계정이 하나 털리면 곧바로 운영 DB 전권이 나간다.
  #   백업 잡이 `permissions: contents: read` 까지 깎아 둔 것과 같은 이유로 여기도 막는다.
  #
  #   조건: push(=main 에 이미 들어온 코드) 또는 **이 리포 안의 브랜치**에서 온 PR 만.
  #   포크 PR 은 이 잡을 건너뛴다 — 어차피 시크릿이 없어 describe.skip 으로 가짜 초록이 될 뿐이다.
  rls-prod:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: RLS 기본 거부 증명(운영)
        run: npm run test:rls:prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # public 스키마 테이블 목록을 런타임에 수집해 새 테이블 누락도 자동 감지한다.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
