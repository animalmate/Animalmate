name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입체크
        run: npm run typecheck
      - name: 단위 테스트(순수 로직)
        run: npm test
      # RLS 기본 거부 증명(규칙 #8). 실제 Supabase 를 대상으로 anon key 로 전 테이블 접근 거부를
      # 검증한다. public 스키마 테이블을 런타임에 수집하므로 새 테이블 누락도 자동 감지.
      # 아래 시크릿은 GitHub 리포 Settings > Secrets and variables > Actions 에 등록해야 한다.
      - name: RLS 보안 테스트
        run: npm run test:rls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # 모집(recruit) 서비스는 db 를 인자로 받지 않고 db/client 싱글턴을 import 한다.
          # 그 싱글턴은 DATABASE_URL 을 읽고 없으면 **import 시점에** throw 하므로, 이 변수가 없으면
          # 테스트가 한 건도 못 돌고 파일 수집 단계에서 실패한다(로컬은 .env 가 채워 줘서 안 보인다).
          # 별도 시크릿을 두지 않고 같은 DB 를 가리키는 DIRECT_URL 을 그대로 쓴다.
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
